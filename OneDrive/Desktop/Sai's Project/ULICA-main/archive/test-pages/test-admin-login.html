<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Login</title>
</head>
<body>
    <h1>Admin Login Test</h1>
    <form id="loginForm">
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" value="admin@ulica.com" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" value="Admin@123" required>
        </div>
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();
                
                if (response.ok) {
                    // Set cookies
                    document.cookie = `accessToken=${data.data.accessToken}; path=/; max-age=86400`;
                    document.cookie = `refreshToken=${data.data.refreshToken}; path=/; max-age=604800`;
                    
                    resultDiv.innerHTML = `
                        <h3>✅ Login Successful!</h3>
                        <p>User: ${data.data.user.name} (${data.data.user.email})</p>
                        <p>Role: ${data.data.user.role}</p>
                        <a href="/admin" target="_blank">Go to Admin Dashboard</a>
                    `;
                } else {
                    resultDiv.innerHTML = `<h3>❌ Login Failed: ${data.message || data.error}</h3>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<h3>❌ Error: ${error.message}</h3>`;
            }
        });
    </script>
</body>
</html>
